[package]
name = "mdbook-doc-graph"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
authors = ["aRustyDev <36318507+aRustyDev@users.noreply.github.com>"]
description = "MDBook preprocessor to build document relationship graphs from frontmatter and inline references"
license = "GPL-3.0-or-later"
repository = "https://github.com/aRustyDev/mdbook-doc-graph"
keywords = ["mdbook", "preprocessor", "graph", "documentation", "relationships"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
mdbook = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
# IMPORTANT: Must use toml 0.5 to match mdbook's version!
# Using 0.8+ will cause type conflicts with mdbook's Table type.
toml = "0.5"

[dev-dependencies]
tempfile = "3.0"
pretty_assertions = "1.0"

[[bin]]
name = "mdbook-doc-graph"
path = "src/main.rs"

[lib]
name = "mdbook_doc_graph"
path = "src/lib.rs"
